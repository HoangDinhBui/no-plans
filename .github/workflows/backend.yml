name: Backend CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: no_plans
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: no_plans_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U no_plans -d no_plans_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://no_plans:test-only@127.0.0.1:5432/no_plans_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./... -count=1
      - run: docker build --tag no-plans-backend:ci .
